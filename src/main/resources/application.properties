spring.application.name=webtech
spring.datasource.url=${DB_URL_RENDER}
spring.datasource.username=${DB_USERNAME_RENDER}
spring.datasource.password=${DB_PASSWORD_RENDER}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Einstellungen
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# "update" erstellt die Tabelle automatisch, falls sie fehlt
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true